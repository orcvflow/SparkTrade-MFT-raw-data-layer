# Kibana — visualization for the logs shipped by Filebeat.
# The raw-data-layer index pattern (raw-data-layer-*) is auto-created via
# Filebeat's setup.template; create the Kibana index pattern via:
#   DevTools: POST /api/saved_objects/index-pattern/raw-data-layer-*  (or the UI)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: raw-data-layer
  labels:
    app.kubernetes.io/name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kibana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.0
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}
            - {name: xpack.security.enabled, value: "false"}
          ports:
            - {name: http, containerPort: 5601}
          resources:
            requests: {cpu: "250m", memory: "512Mi"}
            limits: {cpu: "500m", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: raw-data-layer
  labels:
    app.kubernetes.io/name: kibana
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kibana
  ports:
    - {name: http, port: 5601, targetPort: http}
