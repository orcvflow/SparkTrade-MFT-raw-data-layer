# Filebeat — ships the pipeline's structured JSON logs to Elasticsearch.
#
# Log format (pkg/pipeline/runtime.go → slog.NewJSONHandler):
#   {"time":"2026-07-25T14:30:00.123456789Z","level":"INFO","msg":"...","<attr>":...}
# Field names are the slog defaults: time, level, msg, plus any slog.Attr keys
# added at the call site (e.g. component, source, error). There is no "source"
# field (AddSource is false). output=stdout by default (config.multi.yaml).
#
# Pipeline: container runtime captures stdout → /var/log/containers/*.log
# (containerd JSON envelope {"log":"<inner>","stream":"stdout","time":"..."})
# → Filebeat container input decodes the envelope (inner line → message)
# → decode_json_fields parses the slog JSON from "message" into root fields
#   (time/level/msg/<attrs> with overwrite_keys) → Elasticsearch → Kibana.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: raw-data-layer
  labels:
    app.kubernetes.io/name: filebeat
data:
  filebeat.yml: |-
    filebeat.inputs:
      - type: container
        # Narrow to raw-data-layer pods by container-log filename. K8s names
        # files <pod>_<namespace>_<container>-<id>.log; our sidecar pod is
        # "raw-data-layer-*" in namespace "raw-data-layer", so this glob
        # matches only our containers. For a busier cluster, switch to a
        # kubernetes autodiscover provider + a label condition.
        paths:
          - /var/log/containers/*raw-data-layer*.log
        processors:
          # Decode the slog JSON log line (the inner payload of the containerd
          # envelope) into top-level fields so Kibana can filter by level/msg.
          - decode_json_fields:
              fields: ["message"]
              target: ""
              overwrite_keys: true
              add_error_key: true

    output.elasticsearch:
      hosts: ["elasticsearch:9200"]
      indices:
        - index: "raw-data-layer-%{[agent][version]}-%{+yyyy.MM.dd}"

    setup.template:
      enabled: true
      name: raw-data-layer
      pattern: "raw-data-layer-*"

    setup.ilm:
      enabled: false   # disable for single-node MVP; enable for production retention

    logging.level: info
    logging.json: true
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: filebeat
  namespace: raw-data-layer
  labels:
    app.kubernetes.io/name: filebeat
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: filebeat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: filebeat
    spec:
      serviceAccountName: filebeat
      terminationGracePeriodSeconds: 30
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:8.15.0
          args: ["-c", "/etc/filebeat/filebeat.yml", "-e"]
          env:
            - {name: ELASTICSEARCH_HOST, value: elasticsearch}
            - {name: ELASTICSEARCH_PORT, value: "9200"}
          volumeMounts:
            - {name: config, mountPath: /etc/filebeat}
            - {name: varlog, mountPath: /var/log, readOnly: true}
            - {name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "200m", memory: "256Mi"}
      volumes:
        - name: config
          configMap:
            name: filebeat-config
        - name: varlog
          hostPath: {path: /var/log}
        - name: varlibdockercontainers
          hostPath: {path: /var/lib/docker/containers}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat
  namespace: raw-data-layer
---
# Minimal: container input reads /var/log (hostPath) and needs no K8s API
# access. Add a ClusterRole + Binding only if you switch to kubernetes
# autodiscover (which queries the API for pod metadata).
