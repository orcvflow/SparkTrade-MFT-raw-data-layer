# Prometheus scrape config for the 4-process raw-data-layer pipeline.
#
# Each process exposes /metrics (promhttp.Handler(), see pkg/health/metrics.go)
# on its health port (8081-8084 per config.multi.yaml processes.*):
#   adapter=8081  canonicalizer=8082  publisher=8083  storage=8084
#
# K8s: targets use the Service name `raw-data-layer` (see deployments/k8s/service.yaml)
# which exposes 8081-8084. For docker-compose.multi.yml, replace the host with the
# compose service names: adapter / canonicalizer / publisher / storage.
#
# Metrics exposed (pkg/health/metrics.go) — 8 total:
#   raw_data_messages_received_total{source}        (CounterVec)
#   raw_data_messages_processed_total{source}       (CounterVec)
#   raw_data_adapter_latency_microseconds{source}   (HistogramVec, buckets 100/500/1k/5k/10k)
#   raw_data_queue_depth                            (Gauge)
#   raw_data_backpressure_total                     (Counter)
#   raw_data_wal_writes_total                       (Counter)
#   raw_data_dolphindb_writes_total                 (Counter)
#   raw_data_dolphindb_write_errors_total            (Counter)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: raw-data-layer

scrape_configs:
  - job_name: rdl-adapter
    metrics_path: /metrics
    static_configs:
      - targets: ['raw-data-layer:8081']
        labels: {process: adapter}
  - job_name: rdl-canonicalizer
    metrics_path: /metrics
    static_configs:
      - targets: ['raw-data-layer:8082']
        labels: {process: canonicalizer}
  - job_name: rdl-publisher
    metrics_path: /metrics
    static_configs:
      - targets: ['raw-data-layer:8083']
        labels: {process: publisher}
  - job_name: rdl-storage
    metrics_path: /metrics
    static_configs:
      - targets: ['raw-data-layer:8084']
        labels: {process: storage}
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
